<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radeau Viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;1,400&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: the painting fills a dark gallery wall; the photos hang in its sky, like small framed miniatures. */
:root{
  color-scheme:dark;
  --wall:#14110d; --ink:#e9dfca; --muted:#a89a80; --gilt:#c9a564; --veil:rgba(10,8,5,.93);
  --serif:"Spectral",Georgia,"Times New Roman",serif;
}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--serif);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}
#stage{position:relative;aspect-ratio:1648/1125;width:min(100%,calc((100vh - 110px)*1.4649));max-width:100%;box-shadow:0 0 0 1px #000,0 14px 50px rgba(0,0,0,.7);flex:none}
#stage>img{display:block;width:100%;height:100%}
.vig{position:absolute;width:8%;aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation}
.vig img{display:block;width:100%;height:100%}
.vig:hover{scale:1.15}
.dance{transform-origin:50% 100%;animation:dance 1.1s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.27s)}
@keyframes dance{0%,100%{transform:rotate(-13deg) scale(1.05,.93)}25%{transform:translateY(-16%) rotate(0) scale(.95,1.07)}50%{transform:rotate(13deg) scale(1.05,.93)}75%{transform:translateY(-16%) rotate(0) scale(.95,1.07)}}
.vig:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hint{margin:0;color:var(--muted);font-style:italic;font-size:15px;text-align:center}
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none;width:100%;height:100%;font-family:var(--serif)}
dialog::backdrop{background:var(--veil)}
#box{box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(52px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#big{width:min(64vh,82vw);height:auto}
#cap{margin:0;font-size:17px;text-align:center}
.ctl{position:absolute;min-width:44px;height:44px;background:rgba(20,17,13,.8);color:var(--ink);border:1px solid var(--gilt);font:inherit;font-size:18px;cursor:pointer}
.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#close{top:max(8px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:0 14px;font-size:15px}
@media (prefers-reduced-motion:reduce){.dance{animation:none}.vig:hover{scale:1}}
#hint{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center}
#go{min-height:44px;padding:0 16px;background:var(--gilt);color:#1b140a;border:0;font:inherit;font-style:normal;font-size:16px;cursor:pointer}
#go:disabled{opacity:.6;cursor:wait}
#go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#ar{position:fixed;inset:0;overflow:hidden;background:#000}
#arMsg{position:fixed;left:16px;right:16px;bottom:max(20px,env(safe-area-inset-bottom,0px));margin:0;padding:10px 14px;text-align:center;background:rgba(20,17,13,.82);font-style:italic;z-index:20}
#quit{position:fixed;z-index:20;top:max(8px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:0 14px;font-size:15px}
dialog{z-index:30}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
</head>
<body>
<main id="stage"><img src="radeau.jpg" alt="Le Radeau de la Méduse de Géricault, avec un personnage contemporain en t-shirt ajouté sur le radeau"></main>
<p id="hint"><span id="hintText">Touche un champignon dans le ciel, ou vise ton tableau.</span> <button id="go" type="button">Viser le tableau</button></p>
<div id="ar" hidden></div>
<p id="arMsg" hidden></p>
<button class="ctl" id="quit" type="button" hidden>Quitter</button>
<dialog id="dlg" aria-label="Champignon agrandi">
  <div id="box"><img id="big" class="dance" alt="Champignon blanc au chapeau rouge à points blancs, qui danse"><p id="cap"></p></div>
  <button class="ctl" id="close" type="button">Fermer</button>
</dialog>
<script type="module">
/* Six champignons dans le ciel : position du coin haut gauche, en % du tableau. */
const SPOTS=[[4,7],[14,12],[48,5],[56,14],[80,6],[89,16]];
const SIZE=.08, RATIO=1125/1648;
const $=id=>document.getElementById(id);
const stage=$('stage'),dlg=$('dlg'),cap=$('cap');
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
let opener=null;

/* Le champignon est dessiné une fois, puis sert à l'écran comme sur le tableau filmé. */
function drawMushroom(){
  const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
  g.lineWidth=12;g.strokeStyle='#2a1a12';g.lineJoin='round';
  g.beginPath();g.moveTo(196,270);g.bezierCurveTo(190,360,172,440,186,478);g.quadraticCurveTo(256,506,326,478);g.bezierCurveTo(340,440,322,360,316,270);g.closePath();
  g.fillStyle='#fbf7ec';g.fill();g.stroke();
  const cap=()=>{g.beginPath();g.moveTo(44,276);g.bezierCurveTo(50,110,160,28,256,28);g.bezierCurveTo(352,28,462,110,468,276);g.quadraticCurveTo(256,330,44,276);g.closePath()};
  cap();g.fillStyle='#d3201f';g.fill();
  g.save();cap();g.clip();g.fillStyle='#fff';
  [[256,92,46],[136,150,38],[376,150,38],[256,216,40],[88,246,28],[424,246,28],[176,256,22],[338,256,22]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill()});
  g.restore();cap();g.stroke();
  return c;
}
const canvas=drawMushroom(),URLIMG=canvas.toDataURL('image/png');
$('big').src=URLIMG;

const open_=(i,b)=>{opener=b;cap.textContent='Champignon '+(i+1)+' sur '+SPOTS.length;dlg.showModal()};
SPOTS.forEach(([l,t],i)=>{
  const b=document.createElement('button');b.type='button';b.className='vig';
  b.style.cssText=`left:${l}%;top:${t}%`;
  b.setAttribute('aria-label','Agrandir le champignon '+(i+1));
  const im=document.createElement('img');im.src=URLIMG;im.alt='';im.className='dance';im.style.setProperty('--i',i);
  b.append(im);b.onclick=()=>open_(i,b);stage.append(b);
});
$('close').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg||e.target.id==='box')dlg.close()});
dlg.addEventListener('close',()=>opener&&opener.focus());

/* ---------- Réalité augmentée : le tableau imprimé sert de marqueur (MindAR) ---------- */
const VERSION='radeau-1'; // à changer si radeau.jpg change
const say=t=>{$('arMsg').textContent=t};

function cache(mode,val){return new Promise(res=>{try{
  const o=indexedDB.open('radeauViewer',1);
  o.onupgradeneeded=()=>o.result.createObjectStore('c');
  o.onerror=()=>res(null);
  o.onsuccess=()=>{const st=o.result.transaction('c',mode?'readwrite':'readonly').objectStore('c');
    const r=mode?st.put(val,VERSION):st.get(VERSION);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)};
}catch(e){res(null)}})}

async function target(){
  let buf=await cache(false);
  if(buf)return buf;
  say('Préparation du tableau, une seule fois : 0 %');
  await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
  const img=new Image();img.src='radeau.jpg';await img.decode();
  const c=new window.MINDAR.IMAGE.Compiler();
  await c.compileImageTargets([img],p=>say('Préparation du tableau, une seule fois : '+Math.round(p)+' %'));
  buf=await c.exportData();
  await cache(true,buf);
  return buf;
}

/* MindAR fixe la taille de l'image analysée au démarrage : quand le téléphone tourne, on relance donc la caméra. */
let session=null,turnTimer=0;
const landscape=()=>innerWidth>innerHeight;
function stopAR(){
  const s=session;session=null;if(!s)return;
  try{s.renderer.setAnimationLoop(null)}catch(e){}
  try{s.mind.stop()}catch(e){}
  try{s.renderer.dispose();s.renderer.forceContextLoss()}catch(e){}
  $('ar').textContent='';
}
function checkTurn(){
  if(!session||!session.ready||session.landscape===landscape())return;
  const again=session.again;
  stopAR();say('Le téléphone a tourné, je relance la caméra…');again();
}
addEventListener('resize',()=>{clearTimeout(turnTimer);turnTimer=setTimeout(checkTurn,500)});

async function startAR(){
  const go=$('go');go.disabled=true;
  $('ar').hidden=false;$('quit').hidden=false;$('arMsg').hidden=false;stage.hidden=true;$('hint').hidden=true;
  try{
    const buf=await target();
    say('Ouverture de la caméra…');
    const THREE=await import('three');
    const {MindARThree}=await import('mindar-image-three');
    const url=URL.createObjectURL(new Blob([buf]));
    const mind=new MindARThree({container:$('ar'),imageTargetSrc:url,uiLoading:'no',uiScanning:'no',uiError:'no'});
    const {renderer,scene,camera}=mind;
    const anchor=mind.addAnchor(0);
    const me=session={mind,renderer,ready:false,landscape:landscape(),again:startAR};
    const tex=new THREE.CanvasTexture(canvas);tex.colorSpace=THREE.SRGBColorSpace;
    const geo=new THREE.PlaneGeometry(SIZE,SIZE);geo.translate(0,SIZE/2,0); // pivot au pied, pour danser
    const thumbs=SPOTS.map(([l,t],i)=>{
      const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.1,side:THREE.DoubleSide}));
      const x=l/100+SIZE/2-.5,y=RATIO/2-t/100*RATIO-SIZE;
      m.position.set(x,y,.002+i*.0001);m.userData.i=i;anchor.group.add(m);
      return {m,y,i};
    });
    const LOST='Vise tout le tableau, à environ un mètre.';
    anchor.onTargetFound=()=>say('Touche un champignon dans le ciel.');
    anchor.onTargetLost=()=>say(LOST);
    const ray=new THREE.Raycaster();
    renderer.domElement.style.touchAction='manipulation';
    renderer.domElement.addEventListener('click',e=>{
      const r=renderer.domElement.getBoundingClientRect();
      ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);
      const hit=ray.intersectObjects(thumbs.map(t=>t.m))[0];
      if(hit)open_(hit.object.userData.i,$('quit'));
    });
    await mind.start();
    say(LOST);me.ready=true;
    const t0=performance.now();
    renderer.setAnimationLoop(()=>{
      const t=(performance.now()-t0)/1000;
      if(!still)thumbs.forEach(o=>{
        const w=t*5.7+o.i*1.5,hop=Math.abs(Math.sin(w));
        o.m.rotation.z=Math.cos(w)*.23;
        o.m.position.y=o.y+hop*SIZE*.16;
        o.m.scale.set(1.05-hop*.1,.93+hop*.14,1);
      });
      renderer.render(scene,camera);
    });
    checkTurn();
  }catch(e){
    console.warn(e);session=null;$('ar').textContent='';
    $('ar').hidden=true;$('quit').hidden=true;$('arMsg').hidden=true;stage.hidden=false;$('hint').hidden=false;go.disabled=false;
    $('hintText').textContent='La réalité augmentée n’a pas démarré. Vérifie la connexion et l’accès à la caméra, puis réessaie.';
  }
}
$('go').onclick=startAR;
$('quit').onclick=()=>location.reload();
</script>
</body>
</html>
